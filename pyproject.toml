[project]
name = "mcp-capguard"
version = "0.1.0"
description = "Assert that an MCP server's configuration profile exposes exactly the tools it should, and none it shouldn't — a permission/capability boundary tester, not a schema-drift tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Denis Samatov" }]
dependencies = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/denis-samatov/mcp-capguard"
Repository = "https://github.com/denis-samatov/mcp-capguard"
Issues = "https://github.com/denis-samatov/mcp-capguard/issues"

[project.entry-points.pytest11]
capguard = "mcp_capguard.plugin"

[project.scripts]
capguard = "mcp_capguard.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mcp[cli]>=1.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_capguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
